name: Deploy Backend

# Builds the PocketBase backend image and deploys to the VPS via SSH,
# runs migrations, then restarts the systemd service behind Caddy.
on:
  push:
    paths: ['backend/**']
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}/bv-backend:latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PocketBase image
        run: |
          docker build -t ${{ env.IMAGE }} backend/

      - name: Push image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ${{ env.IMAGE }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /pb
            docker pull ${{ env.IMAGE }}
            docker compose up -d --remove-orphans backend
            # Run migrations inside the container, then bounce behind Caddy.
            # Custom binary (main.go) — stock ./pocketbase does NOT exist in the image.
            docker exec bv-backend ./bv-pocketbase migrate up
            docker restart bv-backend
            curl -fsS http://127.0.0.1:8090/api/health || exit 1
