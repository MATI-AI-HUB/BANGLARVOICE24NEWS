name: Build APKs

# Matrix build of the 4 Banglar Voice Flutter apps on every push/tag.
# Turnkey: keystore (.jks) + key.properties commit করা আছে — তাই কোনো secret ছাড়াই
# সাইনড APK তৈরি হয়। চাইলে secrets.KEYSTORE_* দিয়ে override করা যায়।
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: reader_app
            target: lib/main.dart
            apk_name: reader
            label: 'বাংলার ভয়েস'
          - app: admin_app
            target: lib/main_admin.dart
            apk_name: admin
            label: 'বাংলার ভয়েস অ্যাডমিন'
          - app: reporter_app
            target: lib/main_reporter.dart
            apk_name: reporter
            label: 'বাংলার ভয়েস রিপোর্টার'
          - app: tv_app
            target: lib/main_tv.dart
            apk_name: tv
            label: 'বাংলার ভয়েস টিভি'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get (app + shared package)
        working-directory: mobile_monorepo/apps/${{ matrix.app }}
        run: flutter pub get

      # Signing: each app's android/key.properties + android/app/keystore/*.jks are COMMITTED (turnkey).
      # Secrets override removed — heredoc inside a YAML block scalar broke parsing.
      - name: Verify keystore present
        working-directory: mobile_monorepo/apps/${{ matrix.app }}
        run: |
          test -f android/key.properties && echo "key.properties OK"
          test -f android/app/keystore/banglar-voice-release.jks && echo "keystore OK"

      - name: Build release APK
        working-directory: mobile_monorepo/apps/${{ matrix.app }}
        run: flutter build apk --release --target ${{ matrix.target }}

      - name: Rename artifact
        run: |
          mv mobile_monorepo/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk \
             banglar-voice-${{ matrix.apk_name }}-v1.0.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: banglar-voice-${{ matrix.apk_name }}
          path: banglar-voice-${{ matrix.apk_name }}-v1.0.0.apk
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: banglar-voice-*
          merge-multiple: true
          path: apks

      - name: Create/update GitHub Release with 4 APKs
        run: |
          cd apks
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" *.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" *.apk \
              --title "Banglar Voice ${GITHUB_REF_NAME}" \
              --notes "4টি সাইনড APK (reader / admin / reporter / tv) — ${GITHUB_REF_NAME}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
