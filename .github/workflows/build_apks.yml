name: Build and Release APKs

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify 5 release APKs
    timeout-minutes: 120
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/emulator \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo apt-get clean
          df -h /

      - name: Validate and install release keystore in every app
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64 repository secret}"
          : "${KEYSTORE_PASSWORD:?Missing KEYSTORE_PASSWORD repository secret}"
          : "${KEY_PASSWORD:?Missing KEY_PASSWORD repository secret}"
          : "${KEY_ALIAS:?Missing KEY_ALIAS repository secret}"
          python3 - <<'PY'
          import base64, binascii, os
          from pathlib import Path
          encoded = ''.join(os.environ['ANDROID_KEYSTORE_BASE64'].split())
          try:
              decoded = base64.b64decode(encoded, validate=True)
          except (binascii.Error, ValueError) as exc:
              raise SystemExit('ANDROID_KEYSTORE_BASE64 is malformed; replace it with base64 -w 0 <release.keystore>') from exc
          if len(decoded) < 1024:
              raise SystemExit('Decoded keystore is unexpectedly small; refusing to build')
          if decoded[:4] != b'\xfe\xed\xfe\xed':
              # JKS files begin with FE ED FE ED; PKCS12 is also accepted by
              # keytool below, so only reject an empty/truncated payload here.
              if len(decoded) < 2048:
                  raise SystemExit('Decoded keystore appears truncated; refusing to build')
          for app in ['reader_app', 'admin_app', 'reporter_app', 'tv_app', 'studio_app']:
              target = Path('mobile_monorepo/apps') / app / 'android/app/keystore/banglar-voice-release.jks'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(decoded)
          PY
          keytool -list -keystore mobile_monorepo/apps/reader_app/android/app/keystore/banglar-voice-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          for app in reader_app admin_app reporter_app tv_app studio_app; do
            cat > "mobile_monorepo/apps/$app/android/key.properties" <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore/banglar-voice-release.jks
          EOF
          done

      - name: Build all 5 signed release APKs sequentially
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p apks
          apps=(reader_app admin_app reporter_app tv_app studio_app)
          targets=(lib/main.dart lib/main_admin.dart lib/main_reporter.dart lib/main_tv.dart lib/main_studio.dart)
          names=(reader admin reporter tv studio)
          for i in 0 1 2 3 4; do
            app="${apps[$i]}"; target="${targets[$i]}"; name="${names[$i]}"
            pushd "mobile_monorepo/apps/$app" >/dev/null
            flutter pub get
            flutter build apk --release --target "$target"
            cp build/app/outputs/flutter-apk/app-release.apk "../../../apks/banglar-voice-$name.apk"
            # Keep only the copied APK; Gradle and Flutter intermediates from
            # each app otherwise exhaust the hosted runner disk before app 5.
            flutter clean
            rm -rf android/.gradle
            popd >/dev/null
          done

      - name: Verify APK signatures and output count
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          for apk in apks/*.apk; do
            test -s "$apk"
            "$apksigner" verify --verbose "$apk"
            sha256sum "$apk"
          done
          test "$(find apks -maxdepth 1 -name '*.apk' | wc -l)" -eq 5

      - uses: actions/upload-artifact@v4
        with:
          name: banglar-voice-apks
          path: apks/*.apk
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        run: |
          find mobile_monorepo -name 'banglar-voice-release.jks' -delete 2>/dev/null || true
          find mobile_monorepo -name 'key.properties' -delete 2>/dev/null || true

      - name: Notify build failure webhook
        if: failure()
        env:
          BV_ALERT_WEBHOOK: ${{ secrets.NEWS_INGEST_ALERT_WEBHOOK }}
        run: |
          set -euo pipefail
          if [ -z "${BV_ALERT_WEBHOOK:-}" ]; then
            echo 'NEWS_INGEST_ALERT_WEBHOOK is not configured; skipping notification.'
            exit 0
          fi
          curl -fsS -m 15 -X POST "$BV_ALERT_WEBHOOK" \
            -H 'content-type: application/json' \
            --data '{"event":"apk_build_failed","repository":"MATI-AI-HUB/automation-king-","run":"'"$GITHUB_RUN_ID"'"}'

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: banglar-voice-apks
          path: apks
      - name: Create release with direct APK downloads
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Banglar Voice ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Banglar Voice Android applications
            Direct downloads are attached below:
            - banglar-voice-reader.apk
            - banglar-voice-admin.apk
            - banglar-voice-reporter.apk
            - banglar-voice-tv.apk
            - banglar-voice-studio.apk
          files: apks/*.apk
