name: Build APKs

# Sequential build of the 4 Banglar Voice Flutter apps on every push/tag.
# Why sequential (not a 4-job matrix): on GitHub's free runners, 3-4 heavy
# Flutter+Gradle builds running in PARALLEL starve each other's CPU and hang
# in "flutter build apk" with no log output for hours. Running all 4 apps in
# ONE job, one after another, reuses the same runner's Gradle/Flutter cache,
# so builds 2-4 are much faster and never contend.
# Turnkey: keystore (.jks) + key.properties are committed — no secrets needed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# একই ref-এ একাধিক push হলে পুরোনো রান auto-cancel হয়ে নতুন রান চলে।
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build all 4 APKs (sequential, one runner)
        run: |
          set -euo pipefail
          apps=(reader_app admin_app reporter_app tv_app)
          targets=(lib/main.dart lib/main_admin.dart lib/main_reporter.dart lib/main_tv.dart)
          names=(reader admin reporter tv)
          mkdir -p apks
          for i in 0 1 2 3; do
            app="${apps[$i]}"
            target="${targets[$i]}"
            out="${names[$i]}"
            echo "============================================================"
            echo ">>> BUILDING $app  (target: $target)"
            echo "============================================================"
            cd "mobile_monorepo/apps/$app"
            flutter pub get
            # Turnkey signing: committed keystore + key.properties
            test -f android/key.properties && echo "key.properties OK"
            test -f android/app/keystore/banglar-voice-release.jks && echo "keystore OK"
            flutter build apk --release --target "$target"
            cp build/app/outputs/flutter-apk/app-release.apk "../../../apks/banglar-voice-$out-v1.0.0.apk"
            cd ../../..
            ls -la apks/
          done

      - name: Verify 4 APKs present
        run: |
          cd apks
          ls -la
          test -f banglar-voice-reader-v1.0.0.apk || { echo "MISSING reader APK"; exit 1; }
          test -f banglar-voice-admin-v1.0.0.apk || { echo "MISSING admin APK"; exit 1; }
          test -f banglar-voice-reporter-v1.0.0.apk || { echo "MISSING reporter APK"; exit 1; }
          test -f banglar-voice-tv-v1.0.0.apk || { echo "MISSING tv APK"; exit 1; }
          echo "ALL 4 APKs OK"

      - uses: actions/upload-artifact@v4
        with:
          name: banglar-voice-apks
          path: apks/*.apk
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Required: gh release needs a git repo to resolve GITHUB_REF_NAME/tag.
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: banglar-voice-apks
          path: apks

      - name: Create/update GitHub Release with 4 APKs
        run: |
          cd apks
          ls -la
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" *.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" *.apk \
              --title "Banglar Voice ${GITHUB_REF_NAME}" \
              --notes "4টি সাইনড APK (reader / admin / reporter / tv) — ${GITHUB_REF_NAME}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
