name: Build APKs

# Sequential build of the 5 Banglar Voice Flutter apps on every push/tag.
# Why sequential (not a 4/5-job matrix): on GitHub's free runners, heavy
# Flutter+Gradle builds running in PARALLEL starve each other's CPU and hang
# in "flutter build apk" with no log output for hours. Running apps one after
# another reuses the same runner's Gradle/Flutter cache, so later builds are
# much faster and never contend.
# studio_app (Breaking Live Studio control room) is built in its OWN job so a
# problem there can never break the 4 main apps' build, and vice versa.
# Turnkey: keystore (.jks) + key.properties are committed — no secrets needed.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# একই ref-এ একাধিক push হলে পুরোনো রান auto-cancel হয়ে নতুন রান চলে।
concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build all 4 APKs (sequential, one runner)
        run: |
          set -euo pipefail
          apps=(reader_app admin_app reporter_app tv_app)
          targets=(lib/main.dart lib/main_admin.dart lib/main_reporter.dart lib/main_tv.dart)
          names=(reader admin reporter tv)
          mkdir -p apks
          for i in 0 1 2 3; do
            app="${apps[$i]}"
            target="${targets[$i]}"
            out="${names[$i]}"
            echo "============================================================"
            echo ">>> BUILDING $app  (target: $target)"
            echo "============================================================"
            cd "mobile_monorepo/apps/$app"
            flutter pub get
            # Turnkey signing: committed keystore + key.properties
            test -f android/key.properties && echo "key.properties OK"
            test -f android/app/keystore/banglar-voice-release.jks && echo "keystore OK"
            flutter build apk --release --target "$target"
            cp build/app/outputs/flutter-apk/app-release.apk "../../../apks/banglar-voice-$out-v1.0.0.apk"
            cd ../../..
            ls -la apks/
          done

      - name: Verify 4 APKs present
        run: |
          cd apks
          ls -la
          test -f banglar-voice-reader-v1.0.0.apk || { echo "MISSING reader APK"; exit 1; }
          test -f banglar-voice-admin-v1.0.0.apk || { echo "MISSING admin APK"; exit 1; }
          test -f banglar-voice-reporter-v1.0.0.apk || { echo "MISSING reporter APK"; exit 1; }
          test -f banglar-voice-tv-v1.0.0.apk || { echo "MISSING tv APK"; exit 1; }
          echo "ALL 4 APKs OK"

      - uses: actions/upload-artifact@v7
        with:
          name: banglar-voice-apks
          path: apks/*.apk
          retention-days: 30

  # studio_app built separately so it can never break / be broken by the 4-app job.
  build-studio:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build studio APK (Breaking Live Studio)
        run: |
          set -euo pipefail
          cd mobile_monorepo/apps/studio_app
          flutter pub get
          # Turnkey signing: committed keystore + key.properties
          test -f android/key.properties && echo "key.properties OK"
          test -f android/app/keystore/banglar-voice-release.jks && echo "keystore OK"
          flutter build apk --release --target lib/main_studio.dart
          mkdir -p ../../../apks
          cp build/app/outputs/flutter-apk/app-release.apk ../../../apks/banglar-voice-studio-v1.0.0.apk
          cd ../../..
          ls -la apks/

      - name: Verify studio APK present
        run: |
          cd apks
          ls -la
          test -f banglar-voice-studio-v1.0.0.apk || { echo "MISSING studio APK"; exit 1; }
          echo "ALL 5 APKs OK (studio included)"

      - uses: actions/upload-artifact@v7
        with:
          name: banglar-voice-studio-apk
          path: apks/*.apk
          retention-days: 30

  release:
    needs: [build, build-studio]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Required: gh release needs a git repo to resolve GITHUB_REF_NAME/tag.
      - uses: actions/checkout@v7

      # Merge both artifacts (4-app + studio) into one apks/ folder.
      - uses: actions/download-artifact@v8
        with:
          pattern: banglar-voice-*
          path: apks
          merge-multiple: true

      - name: Create/update GitHub Release with 5 APKs
        run: |
          cd apks
          ls -la
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" *.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" *.apk \
              --title "Banglar Voice ${GITHUB_REF_NAME}" \
              --notes "5টি সাইনড APK (reader / admin / reporter / tv / studio) — ${GITHUB_REF_NAME}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
