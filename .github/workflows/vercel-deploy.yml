name: Vercel Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_SCOPE: banglarvoice33-1162
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Verify token has team access
        run: |
          echo "=== whoami ==="
          vercel whoami --token="$VERCEL_TOKEN" || true
          echo "=== teams list ==="
          vercel teams ls --token="$VERCEL_TOKEN" || true

      - name: Link Vercel Project (with explicit scope)
        working-directory: frontend
        run: |
          vercel link --yes \
            --project banglarvoice-apps \
            --scope "$VERCEL_SCOPE" \
            --token="$VERCEL_TOKEN"
          echo "=== project.json ==="
          cat .vercel/project.json

      - name: Pull environment
        working-directory: frontend
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        working-directory: frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        working-directory: frontend
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
