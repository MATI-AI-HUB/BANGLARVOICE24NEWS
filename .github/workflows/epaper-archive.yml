name: E-paper PDF archive
on:
  repository_dispatch:
    types: [epaper-archive]
  workflow_dispatch:
    inputs:
      edition_date:
        description: Edition date (YYYY-MM-DD, Asia/Dhaka). Defaults to today.
        required: false

permissions:
  contents: read

concurrency:
  group: epaper-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require Supabase secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=""
          [ -n "$SUPABASE_URL" ] || missing="$missing SUPABASE_URL"
          [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository secrets::Add the following under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install renderer
        run: |
          mkdir -p /tmp/renderer && cd /tmp/renderer
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1 @supabase/supabase-js@2
          npx playwright install --with-deps chromium
      - name: Render and upload PDF
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EDITION_DATE: ${{ github.event.inputs.edition_date }}
        run: |
          cp scripts/pipeline/epaper-archive.mjs /tmp/renderer/
          cd /tmp/renderer && node epaper-archive.mjs
