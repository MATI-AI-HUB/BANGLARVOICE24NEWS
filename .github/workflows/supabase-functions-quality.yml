name: Supabase Function Quality

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions-quality.yml'
  push:
    branches: ['feat/**', 'fix/**', 'chore/**']
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/supabase-functions-quality.yml'

permissions:
  contents: read

concurrency:
  group: supabase-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deno-check:
    name: Deno type check deployable functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate deployable Edge Function entry points
        run: |
          set -euo pipefail
          mapfile -t entrypoints < <(
            find supabase/functions \
              -mindepth 2 \
              -maxdepth 2 \
              -type f \
              -name 'index.ts' \
              -print \
              | sort
          )
          test "${#entrypoints[@]}" -gt 0
          deno check "${entrypoints[@]}"
