name: Deploy Supabase Functions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref $PROJECT_ID
      - run: supabase functions deploy news-writer --no-verify-jwt --project-ref $PROJECT_ID
      - run: supabase functions deploy getApiKey --no-verify-jwt --project-ref $PROJECT_ID
      - run: supabase functions deploy news-pipeline --no-verify-jwt --project-ref $PROJECT_ID
