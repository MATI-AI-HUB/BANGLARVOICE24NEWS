name: Deploy Supabase Functions
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_REF || secrets.PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all Edge Functions
        run: |
          if [ -z "$PROJECT_ID" ]; then echo "PROJECT_ID empty - check secret name"; exit 1; fi
          supabase functions deploy --project-ref $PROJECT_ID --no-verify-jwt
