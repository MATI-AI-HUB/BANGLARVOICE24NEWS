name: News ingest

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

concurrency:
  group: news-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Vercel newsroom pipeline
        env:
          NEWSROOM_INGEST_KEY: ${{ secrets.NEWSROOM_INGEST_KEY }}
          BV_BASE_URL: https://www.banglarvoice24news.com
        run: |
          set -euo pipefail
          if [ -z "${NEWSROOM_INGEST_KEY:-}" ]; then
            echo "NEWSROOM_INGEST_KEY secret is not set"; exit 1
          fi
          code=$(curl -sS -m 90 -o response.json -w '%{http_code}' \
            -X POST "$BV_BASE_URL/api/newsroom/cron-trigger" \
            -H "Authorization: Bearer $NEWSROOM_INGEST_KEY" \
            -H "Content-Type: application/json")
          echo "HTTP $code"
          cat response.json; echo
          if [ "$code" -ge 400 ]; then exit 1; fi
