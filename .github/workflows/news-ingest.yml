name: News ingest

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

concurrency:
  group: news-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BV_BASE_URL: https://www.banglarvoice24news.com
      VERCEL_PROJECT_ID: prj_552hrMTjvldSlUHpcuqNqqNbhshb
    steps:
      - name: Resolve newsroom ingest key from Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          FALLBACK_KEY: ${{ secrets.NEWSROOM_INGEST_KEY }}
        run: |
          set -euo pipefail
          key=""
          if [ -n "${VERCEL_TOKEN:-}" ]; then
            envs=$(curl -sS -m 20 -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env?decrypt=true" || true)
            eid=$(printf '%s' "$envs" | python3 -c "import sys,json
try:
    d=json.load(sys.stdin)
    envs=d.get('envs', d) if isinstance(d, dict) else d
    if not isinstance(envs, list):
        envs=d.get('envs', [])
    print(next((e['id'] for e in envs if e.get('key')=='NEWSROOM_INGEST_KEY'),''))
except Exception:
    print('')
" 2>/dev/null || true)
            listed=$(printf '%s' "$envs" | python3 -c "import sys,json,re
try:
    d=json.load(sys.stdin)
    envs=d.get('envs', d) if isinstance(d, dict) else d
    if not isinstance(envs, list):
        envs=d.get('envs', [])
    val=next((e.get('value','') for e in envs if e.get('key')=='NEWSROOM_INGEST_KEY'),'')
    if val and not re.match(r'^(ev:|enc:)', str(val)):
        print(val)
except Exception:
    pass
" 2>/dev/null || true)
            if [ -n "$listed" ]; then
              key="$listed"
            elif [ -n "$eid" ]; then
              key=$(curl -sS -m 20 -H "Authorization: Bearer $VERCEL_TOKEN" \
                "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/env/$eid?decrypt=true" \
                | python3 -c "import sys,json,re
try:
    v=str(json.load(sys.stdin).get('value',''))
    print(v if v and not re.match(r'^(ev:|enc:)', v) else '')
except Exception:
    print('')
" 2>/dev/null || true)
            fi
          fi
          if [ -z "$key" ]; then key="${FALLBACK_KEY:-}"; fi
          if [ -z "$key" ]; then
            echo "::error::Could not resolve NEWSROOM_INGEST_KEY from Vercel or GitHub secrets"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "NEWSROOM_INGEST_KEY=$key" >> "$GITHUB_ENV"
          echo "FALLBACK_KEY=${FALLBACK_KEY:-}" >> "$GITHUB_ENV"

      - name: Trigger Vercel newsroom pipeline
        run: |
          set -euo pipefail
          post() {
            local k="$1"
            curl -sS -m 90 -o response.json -w '%{http_code}' \
              -X POST "$BV_BASE_URL/api/newsroom/cron-trigger" \
              -H "Authorization: Bearer $k" \
              -H "x-ingest-key: $k" \
              -H "Content-Type: application/json"
          }
          echo "::add-mask::${NEWSROOM_INGEST_KEY}"
          if [ -n "${FALLBACK_KEY:-}" ]; then echo "::add-mask::$FALLBACK_KEY"; fi
          code=$(post "$NEWSROOM_INGEST_KEY")
          echo "HTTP $code"
          cat response.json; echo
          if [ "$code" = "401" ] && [ -n "${FALLBACK_KEY:-}" ] && [ "$FALLBACK_KEY" != "$NEWSROOM_INGEST_KEY" ]; then
            echo "Retrying with GitHub NEWSROOM_INGEST_KEY fallback"
            code=$(post "$FALLBACK_KEY")
            echo "HTTP $code"
            cat response.json; echo
          fi
          if [ "$code" -ge 400 ]; then exit 1; fi
