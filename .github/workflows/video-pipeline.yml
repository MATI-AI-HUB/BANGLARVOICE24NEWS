name: Video Pipeline
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      public:
        description: 'Upload as PUBLIC'
        required: false
        default: false
        type: boolean
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install --quiet edge-tts
      - name: Install deps
        working-directory: ./frontend
        run: npm install --no-audit --no-fund
      - name: Generate video
        working-directory: ./frontend
        run: NODE_PATH="$(pwd)/node_modules" node ../scripts/pipeline/generate-video.js --latest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      - name: Upload to YouTube
        working-directory: ./frontend
        run: NODE_PATH="$(pwd)/node_modules" node ../scripts/pipeline/upload-youtube.js --latest
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
