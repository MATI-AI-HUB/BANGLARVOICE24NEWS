name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npx vitest run

  frontend:
    name: Frontend (typecheck + lint + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
      - run: npx vitest run

  secret-scan:
    name: Secret pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on hardcoded JWT blobs
        run: |
          if git grep -n -E 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' -- ':!*.md' ':!docs/**' ':!.github/**'; then
            echo 'Potential JWT secret material in source. Remove before merge.'
            exit 1
          fi
          echo 'No JWT blob in tracked non-doc files.'

  backend:
    name: Backend (go build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: archive/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: archive/backend/go.mod
          cache-dependency-path: archive/backend/go.sum
      - run: go build ./...