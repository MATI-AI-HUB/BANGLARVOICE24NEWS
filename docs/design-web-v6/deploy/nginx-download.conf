# =============================================================================
#  nginx-download.conf — Banglar Voice source-bundle download endpoint
# -----------------------------------------------------------------------------
#  Securely serves the release .zip over HTTPS at:
#      https://banglar-voice-app.yourdomain.com/download/banglar-voice-app.zip
#
#  Install:
#    1) sudo apt install apache2-utils            # provides htpasswd
#    2) sudo mkdir -p /var/www/banglar-voice/downloads /etc/nginx/banglar-voice
#    3) Generate the bundle into that dir (run as the deploy user, NOT root):
#         RELEASE_DIR=/var/www/banglar-voice/downloads \
#           VERSION=1.0.0 ./scripts/bundle_project.sh
#       (creates banglar-voice-app-v1.0.0.zip + stable banglar-voice-app.zip)
#    4) Create the auth file (Basic Auth) — run from a server where your
#       password is typed manually or pasted, never from shell history on a
#       shared box:
#         sudo htpasswd -c /etc/nginx/banglar-voice/.htpasswd devdownload
#    5) Put this file in /etc/nginx/sites-available/, symlink it into
#       sites-enabled/, then:
#         sudo nginx -t && sudo systemctl reload nginx
#
#  Layout assumed:
#      /var/www/banglar-voice/downloads/
#          banglar-voice-app.zip        -> banglar-voice-app-v1.0.0.zip (symlink)
#          banglar-voice-app.zip.sha256
#          banglar-voice-app-v1.0.0.zip
#          banglar-voice-app-v1.0.0.zip.sha256
# =============================================================================

# --- Rate limiting (declare ONCE at http{} level; here for reference) -------
# limit_req_zone  $binary_remote_addr zone=bv_download:10m  rate=5r/s;
# limit_conn_zone $binary_remote_addr zone=bv_download_conn:10m;
#
# If you prefer the secure_link (HMAC expiring-token) option over Basic Auth,
# see the commented alternative at the bottom of this file.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name banglar-voice-app.yourdomain.com;

    # --- HTTPS enforcement ------------------------------------------------
    # Redirect everything to the TLS vhost. (Certbot/Let's Encrypt or your
    # upstream proxy terminates TLS; if TLS is terminated elsewhere, set
    # X-Forwarded-Proto handling accordingly.)
    location / {
        return 301 https://$host$request_uri;
    }

    # ACME challenge must stay reachable over plain HTTP if using certbot.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name banglar-voice-app.yourdomain.com;

    # --- TLS (replace with your cert paths) -------------------------------
    ssl_certificate     /etc/letsencrypt/live/banglar-voice-app.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/banglar-voice-app.yourdomain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # --- Access logging for the download endpoint --------------------------
    access_log /var/log/nginx/banglar-voice-download.access.log;
    error_log  /var/log/nginx/banglar-voice-download.error.log warn;

    # --- Rate limiting (zones declared at http{} level) ---------------------
    limit_req  zone=bv_download burst=20 nodelay;
    limit_conn bv_download_conn 10;

    # --- Basic Auth gate -----------------------------------------------------
    # Username/password managed via: sudo htpasswd -c /etc/nginx/banglar-voice/.htpasswd devdownload
    auth_basic           "Banglar Voice source bundle — authorized access only";
    auth_basic_user_file /etc/nginx/banglar-voice/.htpasswd;

    # =====================================================================
    #  /download/ — serves the source archive as an attachment
    # =====================================================================
    location /download/ {
        alias /var/www/banglar-voice/downloads/;

        # Only the exact artifacts; never allow directory listing or traversal.
        autoindex off;
        deny all;                      # default: no files served by this block

        location ~ ^/download/(banglar-voice-app(?:-v[0-9]+\.[0-9]+\.[0-9]+)?\.zip|banglar-voice-app(?:-v[0-9]+\.[0-9]+\.[0-9]+)?\.zip\.sha256)$ {
            # Re-enable access for the whitelisted release artifacts.
            allow all;

            # Force download as an attachment with a stable name, never inline.
            add_header Content-Disposition 'attachment; filename="banglar-voice-app.zip"' always;

            # One year of immutable caching for a versioned artifact is safe —
            # the URL changes per release. The stable name is a symlink, so it
            # stays short-cached too (nginx resolves the link per request).
            expires 1y;
            add_header Cache-Control "public, immutable";

            # ZIP MIME (also covers .sha256 fallback below).
            types { application/zip zip; }
            default_type application/octet-stream;

            try_files $uri =404;
        }

        # .sha256 files: serve as plain text attachment so users can fetch
        # and run: sha256sum -c banglar-voice-app.zip.sha256
        location ~ ^/download/.*\.sha256$ {
            allow all;
            add_header Content-Disposition 'attachment; filename="banglar-voice-app.zip.sha256"' always;
            default_type text/plain;
            try_files $uri =404;
        }
    }

    # Everything else on this vhost: 404 (no site content is hosted here).
    location / {
        return 404;
    }
}

# =============================================================================
#  OPTION B — secure_link (HMAC expiring tokens) instead of Basic Auth
# -----------------------------------------------------------------------------
#  Replace the two "auth_basic*" lines and the second regex block above with:
#
#     # --- secure_link token gate ---
#     # secret set in /etc/nginx/banglar-voice/secure_link_secret (0600 root)
#     # e.g. 64 random bytes:  head -c 64 /dev/urandom | base64 -w0 | tee file
#     secure_link_secret "$secret";
#
#  Location becomes:
#     location /download/ {
#         alias /var/www/banglar-voice/downloads/;
#         autoindex off;
#         types { application/zip zip; }
#         default_type application/octet-stream;
#
#         # Extract name + HMAC from: /download/<md5_hex>/<file>
#         set $secure_link_secret_file $1;
#         if ($uri ~ ^/download/([a-f0-9]{32})/(.+)$) {
#             set $secure_link $1;
#             set $secure_link_secret_file $2;
#         }
#         secure_link_secret "$secret";        # from the include above
#
#         if ($secure_link = "")  { return 403; }
#         if ($secure_link = "0") { return 410; }   # expired
#
#         add_header Content-Disposition 'attachment; filename="banglar-voice-app.zip"' always;
#         expires 1y;
#         add_header Cache-Control "public, immutable";
#         try_files /$secure_link_secret_file =404;
#     }
#
#  Token generation (Linux / macOS / Git-Bash):
#     SECRET="$(cat /etc/nginx/banglar-voice/secure_link_secret)"
#     MD5=$(printf '%s%s' "$SECRET" "banglar-voice-app-v1.0.0.zip" \
#           | md5sum | awk '{print $1}')
#     echo "https://banglar-voice-app.yourdomain.com/download/$MD5/banglar-voice-app-v1.0.0.zip"
#
#  Recipient link (same command as the requester but copied verbatim):
#     https://banglar-voice-app.yourdomain.com/download/<32-hex-md5>/banglar-voice-app-v1.0.0.zip
# =============================================================================
