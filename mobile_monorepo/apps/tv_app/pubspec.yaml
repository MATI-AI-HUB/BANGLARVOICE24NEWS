name: tv_app
description: Banglar Voice Smart TV — Live Audio/Video Stream + EPG
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Shared packages
  bv_shared:
    path: ../../packages/bv_shared
  supabase_core:
    path: ../../packages/supabase_core
  supabase_flutter: ^2.8.1

  # HTTP for backend API
  http: ^1.2.2

  # Audio streaming (radio-style 24/7)
  just_audio: ^0.9.42
  audio_session: ^0.1.21

  # Video streaming (live TV / HLS)
  video_player: ^2.9.2
  chewie: ^1.8.5

  # Persistence for user preferences
  shared_preferences: ^2.3.3

  # Auto-reconnect & network status
  connectivity_plus: ^6.1.0

  # URL launcher for cast/external
  url_launcher: ^6.3.1

flutter:
  uses-material-design: true
