// Banglar Voice Flutter monorepo
//
// Four entry points (one APK each) sharing packages/ code.
// Only apps/reader_app is build-verified in this sandbox (resource limits);
// the other three are source-ready and buildable with the same commands or
// via .github/workflows/build_apks.yml on GitHub Actions.
//
// Apps:
//   apps/reader_app   — General Reader App (verified, release-signed APK built)
//   apps/admin_app    — Editorial & Admin Command App
//   apps/reporter_app — Field Journalist App
//   apps/tv_app       — Smart TV & Audio Broadcast Streamer
//
// Build (per app):
//   cd apps/<app> && flutter build apk --release
// Keystore: apps/*/android/app/keystore/banglar-voice-release.jks
//   (see android/key.properties in each app; passwords in BV-RELEASE-NOTES.md)
//
// Dart entrypoints
//   apps/reader_app/lib/main.dart
//   apps/admin_app/lib/main_admin.dart
//   apps/reporter_app/lib/main_reporter.dart
//   apps/tv_app/lib/main_tv.dart
name: mobile_monorepo
description: Banglar Voice 4-app Flutter monorepo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

# Shared packages are referenced per-app via path: ../../packages/<pkg>
# (each app keeps its own dependency list; this root pubspec only documents).
