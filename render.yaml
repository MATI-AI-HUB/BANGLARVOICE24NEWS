# Banglar Voice backend — Render Blueprint
#
# HOW TO USE:
#   1. In Render dashboard: New → Blueprint → pick this repo (or paste this file).
#   2. It creates a Docker Web Service from backend/Dockerfile.
#   3. Add the required env vars (SITE_ORIGIN, GROQ_API_KEY, ...) after deploy.
#
# HONEST LIMITS (read before you rely on it):
#   • Render FREE tier: the web service SLEEPS after ~15 min without traffic and
#     cold-starts on the next request (~30-60s delay). Not a true 24/7 guarantee.
#     A free UptimeRobot/healthchecks.io 5-min ping keeps it warm in practice.
#   • Render FREE tier has NO persistent disk. PocketBase keeps its SQLite DB in
#     /pb/pb_data inside the container → any deploy/restart wipes data.
#     → Use this free option only for DEMO/tests. For real persistent data:
#       attach a paid Disk ($7/mo) via the dashboard, or run on a 24/7 VM
#       (Oracle Cloud Always Free / any VPS) where pb_data lives on a volume.
#
# ⚠️ Render Blueprint does NOT support `disk` on free plan — add the disk
#    manually in the dashboard (Mount path MUST be /pb/pb_data) after the
#    first deploy if you upgrade, or keep data elsewhere.
services:
  - type: web
    name: banglar-voice-backend
    runtime: docker
    repo: https://github.com/hizlanews46-design/Banglarvoice-apps
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: ./
    plan: free
    healthCheckPath: /api/bv/health
    envVars:
      - key: PB_HOST
        value: 0.0.0.0
      - key: PB_PORT
        value: "8090"
      - key: SITE_ORIGIN
        value: https://banglarvoice24news.com
      - key: RSS_INGEST
        value: "1"
      # AI keys (optional; without them the matching tier is skipped):
      # - key: GROQ_API_KEY        # https://console.groq.com
      # - key: GEMINI_API_KEY      # https://aistudio.google.com
      # - key: CF_API_KEY          # format <account_id>:<api_token>
      # - key: R2_ENDPOINT
      # - key: R2_BUCKET
      # - key: R2_ACCESS_KEY_ID
      # - key: R2_SECRET_ACCESS_KEY
      # - key: BACKUP_PASSPHRASE
      # - key: STRIPE_SECRET_KEY
      # - key: BKASH_MERCHANT_ID
      # - key: BKASH_APP_SECRET
      # - key: SMTP_HOST
      # - key: SMTP_PORT
      # - key: SMTP_USER
      # - key: SMTP_PASS
